name: StudentPulse AI - CI Validation

on:
  push:
    branches: [ main, "backend/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Dataset & Fixtures
        run: |
          python scripts/generate_data.py --records 5000 --seed 42

      - name: Execute End-to-End Pipeline
        run: |
          python scripts/run_pipeline.py

      - name: Run Dual SQL / Python KPI Parity Validation
        run: |
          python scripts/validate_kpis.py

      - name: Run System Acceptance & Health Check
        run: |
          python scripts/health_check.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v --durations=10
