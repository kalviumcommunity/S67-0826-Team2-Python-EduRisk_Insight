services:
  - type: web
    name: studentpulse-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
